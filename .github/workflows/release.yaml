name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build dashboard (required for go:embed)
        run: cd dashboard && pnpm install --frozen-lockfile && pnpm run build

      - name: Install goreleaser
        run: |
          curl -fsSL -o /tmp/goreleaser.tar.gz "https://github.com/goreleaser/goreleaser/releases/latest/download/goreleaser_Darwin_arm64.tar.gz"
          sudo tar xzf /tmp/goreleaser.tar.gz -C /usr/local/bin goreleaser
          /usr/local/bin/goreleaser --version

      - name: Run goreleaser
        run: /usr/local/bin/goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  docker-image:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build dashboard (required for go:embed)
        run: cd dashboard && pnpm install --frozen-lockfile && pnpm run build

      - name: Build Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -o "dist/elastic-fruit-runner-linux-${arch}" \
              ./cmd/elastic-fruit-runner
          done

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          fail() {
            echo "multi-architecture image release failed: $*" >&2
            exit 1
          }

          command -v jq >/dev/null 2>&1 || fail "jq is unavailable"
          metadata_file="${RUNNER_TEMP}/elastic-fruit-runner-image-metadata.json"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --output type=registry,oci-mediatypes=true \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --metadata-file "${metadata_file}" \
            .

          index_digest="$(jq -er '."containerimage.digest"' "${metadata_file}")" ||
            fail "Buildx metadata has no containerimage.digest: file=${metadata_file}"
          [[ "${index_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] ||
            fail "Buildx returned an invalid OCI index digest: value=${index_digest}"

          manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}')" ||
            fail "cannot inspect published image: reference=${IMAGE}:${VERSION}"
          media_type="$(jq -er '.mediaType' <<<"${manifest}")" ||
            fail "published manifest has no mediaType: reference=${IMAGE}:${VERSION}"
          [[ "${media_type}" == "application/vnd.oci.image.index.v1+json" ]] ||
            fail "published image is not an OCI index: reference=${IMAGE}:${VERSION} media_type=${media_type}"

          inspected_digest="$(jq -er '.digest' <<<"${manifest}")" ||
            fail "published manifest has no digest: reference=${IMAGE}:${VERSION}"
          [[ "${inspected_digest}" == "${index_digest}" ]] ||
            fail "Buildx metadata digest differs from Registry digest: metadata=${index_digest} registry=${inspected_digest}"

          platforms="$(jq -er '[.manifests[] | "\(.platform.os // "missing")/\(.platform.architecture // "missing")"] | sort | join(",")' <<<"${manifest}")" ||
            fail "cannot read published platforms: reference=${IMAGE}:${VERSION}"
          [[ "${platforms}" == "linux/amd64,linux/arm64" ]] ||
            fail "published platform set is invalid: reference=${IMAGE}:${VERSION} platforms=${platforms}"

          latest_manifest="$(docker buildx imagetools inspect "${IMAGE}:latest" \
            --format '{{json .Manifest}}')" ||
            fail "cannot inspect latest image: reference=${IMAGE}:latest"
          latest_digest="$(jq -er '.digest' <<<"${latest_manifest}")" ||
            fail "latest manifest has no digest: reference=${IMAGE}:latest"
          [[ "${latest_digest}" == "${index_digest}" ]] ||
            fail "latest does not reference the release index: expected=${index_digest} actual=${latest_digest}"

          for arch in amd64 arm64; do
            child_digest="$(jq -er --arg arch "${arch}" '
              .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == $arch)
              | .digest
            ' <<<"${manifest}")" ||
              fail "missing platform digest: reference=${IMAGE}:${VERSION} platform=linux/${arch}"
            [[ "${child_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] ||
              fail "invalid platform digest: reference=${IMAGE}:${VERSION} platform=linux/${arch} value=${child_digest}"

            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${IMAGE}:${VERSION}-${arch}" \
              "${IMAGE}@${child_digest}"

            arch_manifest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-${arch}" \
              --format '{{json .Manifest}}')" ||
              fail "cannot inspect compatibility tag: reference=${IMAGE}:${VERSION}-${arch}"
            arch_manifest_count="$(jq -er '.manifests // [] | length' <<<"${arch_manifest}")" ||
              fail "cannot inspect compatibility manifest list: reference=${IMAGE}:${VERSION}-${arch}"
            [[ "${arch_manifest_count}" == "0" ]] ||
              fail "compatibility tag is not a single manifest: reference=${IMAGE}:${VERSION}-${arch} manifests=${arch_manifest_count}"
            arch_digest="$(jq -er '.digest' <<<"${arch_manifest}")" ||
              fail "compatibility manifest has no digest: reference=${IMAGE}:${VERSION}-${arch}"
            [[ "${arch_digest}" == "${child_digest}" ]] ||
              fail "compatibility tag points to the wrong manifest: reference=${IMAGE}:${VERSION}-${arch} expected=${child_digest} actual=${arch_digest}"
          done
