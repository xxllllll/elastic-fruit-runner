# elastic-fruit-runner configuration
# Place this file at: ~/.elastic-fruit-runner/config.yaml

# Management API is local-only by default.
api_addr: 127.0.0.1:8080

# Required when a docker-host runner set is configured.
# Use a host directory with enough space for shared build caches.
# cache_root: /path/to/elastic-fruit-runner/cache

# Organization-level runner sets
orgs:
  - org: your-org
    auth:
      # Option A: GitHub App (recommended)
      github_app:
        client_id: Iv1.xxxxxxxxxxxxxxxx
        installation_id: 12345678
        private_key_path: /path/to/private-key.pem

      # Option B: Personal Access Token (uncomment and remove github_app above)
      # pat_token: github_pat_xxx

    runner_group: Default
    runner_sets:
      # macos runners via Tart VMs (Apple Silicon only)
      - name: efr-macos-arm64
        backend: tart
        image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.3
        labels: [self-hosted, macos, arm64]
        max_runners: 2

      # linux arm64 runners via Docker (DinD image includes Docker daemon)
      - name: efr-linux-arm64
        backend: docker
        image: ghcr.io/actions-runner-controller/actions-runner-controller/actions-runner-dind:latest
        labels: [self-hosted, linux, arm64]
        max_runners: 4
        platform: linux/arm64

      # linux amd64 runners via Docker (uses Rosetta 2 emulation on Apple Silicon)
      - name: efr-linux-amd64
        backend: docker
        image: ghcr.io/actions-runner-controller/actions-runner-controller/actions-runner-dind:latest
        labels: [self-hosted, linux, amd64]
        max_runners: 4
        platform: linux/amd64

# Repository-level runner sets (no runner_group — repos use default)
# repos:
#   - repo: your-org/your-repo
#     auth:
#       pat_token: github_pat_xxx
#     runner_sets:
#       - name: repo-runner
#         backend: docker
#         image: ghcr.io/actions-runner-controller/actions-runner-controller/actions-runner-dind:latest
#         labels: [self-hosted, linux, arm64]
#         max_runners: 2

# First-phase Mac mini + OrbStack runner. Resolve the published version with
# images/docker-host-runner/resolve-release.sh and pin the returned index digest.
# repos:
#   - repo: your-org/your-private-repo
#     auth:
#       pat_token: github_pat_xxx
#     runner_sets:
#       - name: repo-orbstack-amd64
#         backend: docker-host
#         image: ghcr.io/xxllllll/elastic-fruit-runner/docker-host-runner@sha256:<verified-index-digest>
#         labels: [self-hosted, linux, amd64]
#         max_runners: 1
#         platform: linux/amd64
#         cache_namespace: your-private-repo
#         # For a native Apple Silicon runner, keep the same index digest,
#         # change the platform to linux/arm64, and replace amd64 with arm64.
# cache_root: /path/to/elastic-fruit-runner/cache

idle_timeout: 15m

# Cross-origin API access is disabled by default. The bundled dashboard is
# served from the same address and does not require CORS. Configure an origin
# only when a separate web application must call the API.
# cors:
#   allow_origin: "https://dashboard.example.com"
#   allow_methods: "GET, POST, OPTIONS"
#   allow_headers: "Content-Type, Connect-Protocol-Version"
#   expose_headers: "Connect-Protocol-Version"
#   allow_credentials: false
#   max_age: 0
